<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师端后台登录</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f3f6fb;
            color: #1f2937;
        }

        .login-panel {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            background: #ffffff;
            border: 1px solid #dbe3ef;
            border-radius: 8px;
            box-shadow: 0 12px 30px rgba(31, 41, 55, 0.08);
        }

        h1 {
            margin: 0 0 24px;
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            color: #12355b;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 44px;
            margin-bottom: 18px;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus {
            border-color: #2563eb;
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .error {
            margin: 0 0 18px;
            padding: 10px 12px;
            border: 1px solid #fecaca;
            border-radius: 6px;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 14px;
        }

        button {
            width: 100%;
            height: 46px;
            border: 0;
            border-radius: 6px;
            background: #1d4ed8;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }
    </style>
</head>
<body>
    <main class="login-panel">
        <h1>教师端后台登录</h1>

        {% if error_message %}
            <p class="error">{{ error_message }}</p>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}

            <label for="username">用户名</label>
            <input id="username" name="username" type="text" autocomplete="username" required>

            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button type="submit">登录</button>
        </form>
    </main>
</body>
</html>
