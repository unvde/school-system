<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师端后台首页</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f3f6fb;
            color: #1f2937;
        }

        .page {
            width: 100%;
            max-width: 760px;
            margin: 72px auto;
            padding: 0 24px;
        }

        .content {
            padding: 32px;
            background: #ffffff;
            border: 1px solid #dbe3ef;
            border-radius: 8px;
            box-shadow: 0 12px 30px rgba(31, 41, 55, 0.08);
        }

        p {
            margin: 0 0 16px;
            font-size: 18px;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 18px;
            border-radius: 6px;
            background: #1d4ed8;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            background: #1e40af;
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="content">
            <p>当前登录用户：{{ request.user.username }}</p>
            <p>当前页面：教师端后台首页（占位）</p>
            <a href="{% url 'logout' %}">退出登录</a>
        </section>
    </main>
</body>
</html>
